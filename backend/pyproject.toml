[project]
name = "card-info-extractor-backend"
version = "0.0.1"
description = "Backend (FastAPI) for the sports card image info extractor: Claude extraction + enrichment + normalization."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Runtime deps for the API service (Phase 1 Claude extraction engine).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "jsonschema>=4.20",
    "pillow>=10.0",
]
# Tooling for tests and type (re)generation.
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "datamodel-code-generator>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
