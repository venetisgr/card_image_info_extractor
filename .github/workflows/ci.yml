name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend
        run: pip install -e "./backend[api,dev]"
      - name: Run backend tests (no network/API key needed)
        run: python -m pytest backend -q

  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Parser unit tests (JVM-only module)
        env:
          CARDX_CORE_ONLY: "1"
        run: gradle -p android :core:test --console=plain
